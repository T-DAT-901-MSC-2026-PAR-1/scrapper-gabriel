services:
  scrapper:
    build:
      context: ../..
      dockerfile: ./docker/dev/Dockerfile
    volumes:
      # Mount source code for hot-reloading
      - ../..:/app
      - venv:/app/.venv
    env_file: .env
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: /app/docker/entrypoint.dev.sh
    networks:
      - kafka_kafka

volumes:
  venv:

networks:
  kafka_kafka:
    external: true
